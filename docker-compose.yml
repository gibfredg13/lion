version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: hackmerlin-db
    environment:
      POSTGRES_DB: hackmerlin
      POSTGRES_USER: hackmerlin
      POSTGRES_PASSWORD: hackmerlin_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hackmerlin-network
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackmerlin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main HackMerlin Application
  hackmerlin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackmerlin-app
    ports:
      - "8080:8080"
    environment:
      MERLIN_LLM_PROVIDER: ${MERLIN_LLM_PROVIDER:-ollama}
      MERLIN_LLM_BASEURL: ${MERLIN_LLM_BASEURL:-http://ollama:11434}
      MERLIN_LLM_DEFAULTMODEL: ${MERLIN_LLM_DEFAULTMODEL:-llama2}
      MERLIN_LLM_ADVANCEDMODEL: ${MERLIN_LLM_ADVANCEDMODEL:-llama2}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hackmerlin
      SPRING_DATASOURCE_USERNAME: hackmerlin
      SPRING_DATASOURCE_PASSWORD: hackmerlin_secure_password
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - hackmerlin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Ollama Service (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: hackmerlin-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - hackmerlin-network
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    restart: unless-stopped
    # Pull model on startup
    entrypoint: sh -c 'ollama serve & sleep 3 && ollama pull ${MERLIN_LLM_DEFAULTMODEL:-llama2} && wait'

networks:
  hackmerlin-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
