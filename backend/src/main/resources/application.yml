spring:
  config:
    import: classpath:levels.yml
  jpa:
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  session:
    store-type: memory
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:hsqldb:mem:testdb;sql.syntax_pgs=true
management:
  endpoints:
    web:
      exposure:
        include: prometheus
