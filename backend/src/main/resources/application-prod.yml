spring:
  main:
    lazy-initialization: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: ALWAYS
  datasource:
    url: jdbc:postgresql://postgres:5432/hackmerlin
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      max-lifetime: 240000 # 4 minutes
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
server:
  servlet:
    session:
      cookie:
        secure: false
        same-site: lax
        http-only: true
  error:
    include-message: never
merlin:
